<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Assist — Providers</title>
    <link rel="stylesheet" href="providers.css" />
  </head>
  <body>
    <main class="providers">
      <header class="providers-header">
        <div class="providers-header-row">
          <h1 data-i18n="providersTitle">Providers</h1>
          <div class="providers-header-actions">
            <button id="add-provider" class="btn btn-primary" data-i18n="providerAddProvider">
              Add provider
            </button>
            <button id="refresh-prices" class="btn btn-outline" data-i18n="providerRefreshPrices">
              Refresh prices
            </button>
          </div>
        </div>
        <p data-i18n="providersSubtitle">
          Configure your API keys and models.
        </p>
        <div id="providers-status" class="providers-status"></div>
      </header>

      <div id="providers-error" class="providers-error"></div>

      <!-- Add custom provider -->
      <section id="add-provider-form" class="add-provider-form" style="display: none">
        <h2 data-i18n="providerAddProviderTitle">Add a custom provider</h2>

        <label class="add-provider-template">
          <span data-i18n="providerTemplateLabel">Template</span>
          <select id="ap-template"></select>
        </label>
        <div id="ap-endpoints-note" class="add-provider-note" style="display: none"></div>

        <div class="add-provider-grid">
          <label>
            <span data-i18n="providerAddLabel">Name</span>
            <input type="text" id="ap-label" data-i18n-placeholder="providerAddLabelPlaceholder"
              placeholder="My provider" autocomplete="off" />
          </label>
          <label>
            <span data-i18n="providerAddBaseUrl">Base URL</span>
            <input type="text" id="ap-baseurl" data-i18n-placeholder="providerAddBaseUrlPlaceholder"
              placeholder="https://api.example.com/v1" autocomplete="off" />
          </label>
          <label>
            <span data-i18n="providerAddDialect">Dialect</span>
            <select id="ap-dialect">
              <option value="openai-compatible" data-i18n="providerDialectOpenAI">
                OpenAI-compatible
              </option>
              <option value="anthropic" data-i18n="providerDialectAnthropic">
                Anthropic-compatible
              </option>
              <option value="openai-responses" data-i18n="providerDialectResponses">
                OpenAI Responses
              </option>
            </select>
          </label>
        </div>

        <details class="add-provider-advanced">
          <summary data-i18n="providerAddAdvanced">Advanced</summary>
          <div class="add-provider-grid">
            <label>
              <span data-i18n="providerMaxTokensParam">Token limit field</span>
              <select id="ap-maxtokens">
                <option value="max_tokens">max_tokens</option>
                <option value="max_completion_tokens">max_completion_tokens</option>
              </select>
            </label>
            <label class="add-provider-check">
              <input type="checkbox" id="ap-thinking" />
              <span data-i18n="providerDefaultThinking">Thinking / reasoning by default</span>
            </label>
            <label class="add-provider-check">
              <input type="checkbox" id="ap-images" />
              <span data-i18n="providerCapImages">Supports images</span>
            </label>
            <label class="add-provider-check">
              <input type="checkbox" id="ap-matching" checked />
              <span data-i18n="providerCapMatching">Supports matching questions</span>
            </label>
            <label class="add-provider-full">
              <span data-i18n="providerHeaders">Headers (Name: value per line)</span>
              <textarea id="ap-headers" rows="3" placeholder="x-opencode-session: ..."></textarea>
            </label>
          </div>
        </details>

        <div class="add-provider-actions">
          <button id="ap-cancel" class="btn btn-outline" data-i18n="providerCancel">Cancel</button>
          <button id="ap-save" class="btn btn-primary" data-i18n="providerSaveProvider">Save provider</button>
        </div>
      </section>

      <div id="providers-list"></div>
    </main>

    <script src="providers.js"></script>
  </body>
</html>
